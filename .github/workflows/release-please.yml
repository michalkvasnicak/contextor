name: Release Please

on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  build-binaries:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Build CLI
        run: |
          rustup target add --toolchain stable "$TARGET"
          cargo +stable build --locked --release --manifest-path contextor/Cargo.toml \
            --target "$TARGET" --target-dir contextor/target
      - name: Package binary and license
        run: |
          package_dir="$RUNNER_TEMP/contextor-package"
          mkdir -p "$package_dir" dist
          cp "contextor/target/$TARGET/release/contextor" LICENSE "$package_dir/"
          tar -czf "dist/contextor-$TARGET.tar.gz" -C "$package_dir" contextor LICENSE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contextor-${{ matrix.target }}
          path: dist/contextor-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  upload-binaries:
    needs: [release-please, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: contextor-*
          path: dist
          merge-multiple: true
      - name: Upload release assets
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          sha256sum contextor-*.tar.gz > SHA256SUMS
          gh release upload "$RELEASE_TAG" contextor-*.tar.gz SHA256SUMS --clobber
